# AEGIS Arbitrage System - GitLab CI/CD
# Builds: backend/frontend Docker images + Electron desktop apps

stages:
  - test
  - build
  - docker
  - release

variables:
  NODE_VERSION: "22"
  DESKTOP_DIR: "./desktop"
  BACKEND_DIR: "./backend"
  FRONTEND_DIR: "./frontend"
  DOCKER_REGISTRY: "${CI_REGISTRY}"
  DOCKER_IMAGE_BACKEND: "${CI_REGISTRY_IMAGE}/backend"
  DOCKER_IMAGE_FRONTEND: "${CI_REGISTRY_IMAGE}/frontend"

cache:
  key:
    files:
      - package-lock.json
  paths:
    - node_modules/
    - .npm/

# ==================== Test Stage ====================

test:backend:
  stage: test
  image: node:${NODE_VERSION}
  before_script:
    - cd ${BACKEND_DIR}
    - npm ci
  script:
    - npm run test
  only:
    - main
    - develop
    - merge_requests

test:frontend:
  stage: test
  image: node:${NODE_VERSION}
  before_script:
    - cd ${FRONTEND_DIR}
    - npm ci
  script:
    - npm run build
  only:
    - main
    - develop
    - merge_requests

# ==================== Docker Build Stage ====================

docker:backend:
  stage: docker
  image: docker:24
  services:
    - docker:24-dind
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
  before_script:
    - docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" "$CI_REGISTRY"
  script:
    - docker build -t "${DOCKER_IMAGE_BACKEND}:${CI_COMMIT_SHORT_SHA}" -t "${DOCKER_IMAGE_BACKEND}:latest" -f Dockerfile.backend .
    - docker push "${DOCKER_IMAGE_BACKEND}:${CI_COMMIT_SHORT_SHA}"
    - docker push "${DOCKER_IMAGE_BACKEND}:latest"
  only:
    - main
    - tags

docker:frontend:
  stage: docker
  image: docker:24
  services:
    - docker:24-dind
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
  before_script:
    - docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" "$CI_REGISTRY"
  script:
    - docker build -t "${DOCKER_IMAGE_FRONTEND}:${CI_COMMIT_SHORT_SHA}" -t "${DOCKER_IMAGE_FRONTEND}:latest" -f Dockerfile.frontend .
    - docker push "${DOCKER_IMAGE_FRONTEND}:${CI_COMMIT_SHORT_SHA}"
    - docker push "${DOCKER_IMAGE_FRONTEND}:latest"
  only:
    - main
    - tags

# ==================== Desktop Build Stage ====================

build:windows:
  stage: build
  tags:
    - windows
    - electron
  before_script:
    - cd ${DESKTOP_DIR} && npm ci
    - cd ../frontend && npm ci && npm run build
    - cd ../backend && npm ci
  script:
    - cd ${DESKTOP_DIR}
    - npm run build:win
  artifacts:
    name: "aegis-windows-${CI_COMMIT_SHORT_SHA}"
    paths:
      - ${DESKTOP_DIR}/dist-electron/*.exe
      - ${DESKTOP_DIR}/dist-electron/*.zip
      - ${DESKTOP_DIR}/dist-electron/latest.yml
    expire_in: 7 days
  only:
    - tags

build:mac:
  stage: build
  tags:
    - macos
    - electron
  before_script:
    - cd ${DESKTOP_DIR} && npm ci
    - cd ../frontend && npm ci && npm run build
    - cd ../backend && npm ci
  script:
    - cd ${DESKTOP_DIR}
    - npm run build:mac
  artifacts:
    name: "aegis-macos-${CI_COMMIT_SHORT_SHA}"
    paths:
      - ${DESKTOP_DIR}/dist-electron/*.dmg
      - ${DESKTOP_DIR}/dist-electron/*.zip
      - ${DESKTOP_DIR}/dist-electron/latest-mac.yml
    expire_in: 7 days
  only:
    - tags

# ==================== Release Stage ====================

release:gitlab:
  stage: release
  image: registry.gitlab.com/gitlab-org/release-cli:latest
  needs:
    - docker:backend
    - docker:frontend
  script:
    - echo "Creating GitLab Release for ${CI_COMMIT_TAG}"
  release:
    name: 'AEGIS v${CI_COMMIT_TAG}'
    description: |
      ## AEGIS Arbitrage System v${CI_COMMIT_TAG}
      
      ### Docker Images
      - Backend: `${DOCKER_IMAGE_BACKEND}:${CI_COMMIT_TAG}`
      - Frontend: `${DOCKER_IMAGE_FRONTEND}:${CI_COMMIT_TAG}`
      
      ### Deploy
      ```bash
      docker compose pull && docker compose up -d
      ```
      
      Build: ${CI_PIPELINE_CREATED_AT} | Commit: ${CI_COMMIT_SHORT_SHA}
    tag_name: '${CI_COMMIT_TAG}'
    ref: '${CI_COMMIT_SHA}'
  only:
    - tags

# ==================== Manual Triggers ====================

manual:deploy:
  stage: release
  when: manual
  image: docker:24
  services:
    - docker:24-dind
  script:
    - echo "Deploying to production..."
    - docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" "$CI_REGISTRY"
    - docker pull "${DOCKER_IMAGE_BACKEND}:latest"
    - docker pull "${DOCKER_IMAGE_FRONTEND}:latest"
    # Add your deployment commands here (e.g. docker compose, kubectl, ssh)
  only:
    - main
