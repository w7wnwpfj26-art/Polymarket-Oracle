name: Feature Request
description: Suggest a new feature or enhancement
title: "[FEATURE] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for suggesting a feature! Help us understand your idea.

  - type: textarea
    id: problem
    attributes:
      label: Problem / Motivation
      description: What problem does this feature solve? What's the use case?
      placeholder: "I'm always frustrated when... / It would be useful to have..."
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution
      description: How would you like to see this implemented?
      placeholder: "I'd like to see a feature that..."
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: Have you thought of any alternative solutions or workarounds?
      placeholder: "I considered using X, but..."

  - type: dropdown
    id: category
    attributes:
      label: Feature Category
      description: Which part of the system does this relate to?
      options:
        - "AI Agents"
        - "Arbitrage Detection"
        - "Risk Management"
        - "UI/UX"
        - "API"
        - "Data Sources (Polymarket, Kalshi, etc.)"
        - "Notifications"
        - "Performance"
        - "Security"
        - "DevOps / Deployment"
        - "Other"
    validations:
      required: true

  - type: dropdown
    id: priority
    attributes:
      label: Priority (your opinion)
      options:
        - "Nice to have"
        - "Would improve my workflow"
        - "Critical for my use case"

  - type: textarea
    id: additional
    attributes:
      label: Additional Context
      description: Any mockups, screenshots, or related links?

  - type: checkboxes
    id: checklist
    attributes:
      label: Pre-submission Checklist
      options:
        - label: I have searched existing issues to ensure this is not a duplicate
          required: true
        - label: I am willing to contribute a PR if guided
          required: false
