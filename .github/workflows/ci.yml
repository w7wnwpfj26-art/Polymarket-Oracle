name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  backend-test:
    name: Backend Tests
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        node-version: [22.x]
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'
        cache-dependency-path: new/backend/package-lock.json
    
    - name: Install dependencies
      working-directory: new/backend
      run: npm ci
    
    - name: Run tests
      working-directory: new/backend
      run: npm test
      env:
        NODE_ENV: test
    
    - name: Lint check
      working-directory: new/backend
      run: npx tsc --noEmit || true

  frontend-build:
    name: Frontend Build
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        node-version: [22.x]
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'
        cache-dependency-path: new/frontend/package-lock.json
    
    - name: Install dependencies
      working-directory: new/frontend
      run: npm ci
    
    - name: Build frontend
      working-directory: new/frontend
      run: npm run build
    
    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: frontend-dist
        path: new/frontend/dist
        retention-days: 7

  docker-build:
    name: Docker Build Test
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
    
    - name: Build backend image
      uses: docker/build-push-action@v5
      with:
        context: new
        file: new/Dockerfile.backend
        push: false
        tags: aegis-backend:test
        cache-from: type=gha
        cache-to: type=gha,mode=max
    
    - name: Build frontend image
      uses: docker/build-push-action@v5
      with:
        context: new
        file: new/Dockerfile.frontend
        push: false
        tags: aegis-frontend:test
        cache-from: type=gha
        cache-to: type=gha,mode=max

  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Run Trivy vulnerability scanner
      uses: aquasecurity/trivy-action@master
      with:
        scan-type: 'fs'
        scan-ref: 'new'
        format: 'sarif'
        output: 'trivy-results.sarif'
    
    - name: Upload Trivy results to GitHub Security
      uses: github/codeql-action/upload-sarif@v3
      with:
        sarif_file: 'trivy-results.sarif'

  integration-test:
    name: Integration Test
    runs-on: ubuntu-latest
    needs: [backend-test, frontend-build]
    
    services:
      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 22.x
        cache: 'npm'
        cache-dependency-path: new/backend/package-lock.json
    
    - name: Install backend dependencies
      working-directory: new/backend
      run: npm ci
    
    - name: Start backend server
      working-directory: new/backend
      run: |
        npm run dev &
        sleep 10
      env:
        PORT: 7700
        NODE_ENV: test
        REDIS_HOST: localhost
        REDIS_PORT: 6379
    
    - name: Health check
      run: |
        curl -f http://localhost:7700/health || exit 1
        echo "✅ Backend health check passed"
    
    - name: API smoke test
      run: |
        curl -f http://localhost:7700/api/markets || exit 1
        curl -f http://localhost:7700/api/agents || exit 1
        echo "✅ API smoke tests passed"
